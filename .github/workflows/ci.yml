name: ScamTrace CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-and-test:
    name: Build, Seed 1500+ Records & Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: 'file:./dev.db'
      SESSION_SECRET: 'ci-test-session-secret-key-minimum-32-chars-2026'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      NEXT_PUBLIC_ENVIRONMENT_LABEL: 'CI Verification Workspace'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Apply Schema
        run: |
          npx prisma generate
          npx prisma db push

      - name: Seed 1,500+ Synthetic Records
        run: npm run db:seed

      - name: Verify Dataset Minimum Record Counts (>= 1,500)
        run: npm run db:verify

      - name: Run TypeScript Type Checking
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm test

      - name: Build Production Application
        run: npm run build

